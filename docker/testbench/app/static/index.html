<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CosyVoice3 台語模型試聽台</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2a2f3d; --ink: #e6e8ee;
    --muted: #8b93a7; --accent: #6ea8fe; --ok: #4ec9a5; --warn: #e6a23c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 system-ui, "Noto Sans TC", sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 19px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  main { display: grid; grid-template-columns: 400px 1fr; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; letter-spacing: .02em; }
  label:first-child { margin-top: 0; }
  select, textarea, input[type=text], input[type=number] {
    width: 100%; background: #0e1016; color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 9px 10px; font: inherit; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 74px; }
  button { background: var(--accent); color: #0b0d12; border: 0; border-radius: 7px;
           padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer; width: 100%; margin-top: 18px; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line);
                 width: auto; padding: 6px 12px; margin: 0; font-weight: 400; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px;
         background: #232838; color: var(--muted); border: 1px solid var(--line); }
  .tag.b { color: var(--accent); border-color: #33415c; }
  .tag.up { color: #9fdcb4; border-color: #4a7c59; }
  .tag.seed { cursor: pointer; color: var(--ok); border-color: #2d5548; }
  .tag.seed:hover { background: #2d5548; color: #eafff8; }
  audio { width: 100%; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 20px; }
  .err { color: #ff8f8f; }
  .status { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 18px; }
  .uprow { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .filebtn { flex: 1; display: block; text-align: center; cursor: pointer; margin: 0;
             background: transparent; color: var(--ink); border: 1px dashed var(--line);
             border-radius: 7px; padding: 9px 12px; font-size: 13px; letter-spacing: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filebtn:hover { border-color: var(--accent); color: var(--accent); }
  .filebtn.has { border-style: solid; border-color: #4a7c59; color: #9fdcb4; background: #16241c; }
  #src_preview { margin-top: 8px; height: 34px; }
  .active-src { margin-top: 10px; padding: 8px 11px; border-radius: 7px; font-size: 12px;
                border: 1px solid var(--line); background: #0e1016; color: var(--muted); }
  .active-src b { color: var(--ink); font-weight: 600; }
  .active-src.upload { border-color: #4a7c59; background: #16241c; color: #9fdcb4; }
  .active-src.upload b { color: #d6ffe6; }
  .active-src.bad { border-color: #7c4a4a; background: #241618; color: #ffb3b3; }
  .active-src.bad b { color: #ffd6d6; }
  select:disabled { opacity: .38; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  /* 要唸的文字和 instruction 原本是兩個一模一樣的方塊，很容易貼錯欄位 */
  .lblrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  button.ghost.tiny { padding: 3px 9px; font-size: 11px; }
  textarea.secondary { min-height: 52px; font-size: 12px; color: var(--muted); background: #0b0d12; }
  textarea.secondary:focus { color: var(--ink); }
  .hint.warn { color: #ffcf8f; }
</style>
</head>
<body>
<header>
  <h1>CosyVoice3 台語模型試聽台</h1>
  <div class="sub" id="health">載入中…</div>
</header>

<main>
  <section class="panel">
    <label>LLM</label>
    <select id="llm"></select>

    <label>Flow</label>
    <select id="flow"></select>

    <label>HiFi-GAN (hift)</label>
    <select id="hift"></select>

    <label>華語文字</label>
    <textarea id="text">明天早上九點，我們一起去市場買東西。</textarea>

    <label class="lblrow">
      <span>Instruction（訓練與推論必須一致，通常不用改）</span>
      <button type="button" class="ghost tiny" id="instr_reset">復原預設</button>
    </label>
    <textarea id="instruct" class="secondary" spellcheck="false"></textarea>
    <div class="hint" id="instr_warn" hidden></div>

    <label>音色來源</label>
    <select id="prompt_name"></select>
    <div class="hint">或上傳自己的參考音檔（上傳後會蓋過上面的選擇）</div>
    <div class="uprow">
      <input type="file" id="prompt_wav" accept="audio/*" hidden>
      <label for="prompt_wav" class="filebtn" id="filebtn_label">選擇音檔…</label>
      <button class="ghost" id="clear_upload" hidden>取消上傳</button>
    </div>
    <div class="active-src" id="active_src"></div>
    <audio id="src_preview" controls preload="none"></audio>

    <div class="row">
      <div>
        <label>語速</label>
        <input type="number" id="speed" value="1.0" step="0.05" min="0.5" max="2.0">
      </div>
      <div>
        <label>文字正規化</label>
        <select id="text_frontend">
          <option value="false" selected>關閉（建議）</option>
          <option value="true">開啟</option>
        </select>
      </div>
    </div>

    <label>Seed</label>
    <div class="row">
      <input type="number" id="seed" value="-1" step="1" min="-1" max="2147483647">
      <button class="ghost" id="reroll" style="width:100%">隨機</button>
    </div>
    <div class="hint">-1 = 每次隨機。填 0–2147483647 可重現同一結果，方便比較不同 checkpoint。</div>

    <button id="go">合成</button>
    <div class="status" id="status"></div>
  </section>

  <section>
    <div class="head">
      <div class="sub">結果（新的在最上面，可互相比較）</div>
      <button class="ghost" id="clear">清除</button>
    </div>
    <div id="results"><div class="empty">還沒有結果</div></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let meta = null;

let DEFAULT_INSTRUCT = "";

// Instruction 少了 <|endofprompt|> 時後端會自動補上，所以不會壞；但如果是把要唸的
// 句子誤貼到這裡，補完照樣會合成出莫名其妙的東西，所以在送出前先提醒。
function checkInstruct() {
  const box = $("instruct"), warn = $("instr_warn");
  const v = box.value.trim();
  let msg = "";
  if (!v) {
    msg = "空白，送出時會用預設值。";
  } else if (!v.includes("<|endofprompt|>")) {
    msg = v.length > 60
      ? "這段看起來像要唸的內容，不是 instruction。要唸的文字請放上面的「華語文字」欄位。"
      : "缺少 <|endofprompt|>，送出時會自動補上。";
  } else if (DEFAULT_INSTRUCT && v !== DEFAULT_INSTRUCT.trim()) {
    msg = "已偏離預設值。instruction 必須和訓練時一致，否則輸出會退化。";
  }
  warn.textContent = msg;
  warn.hidden = !msg;
  warn.className = msg ? "hint warn" : "hint";
}

function fill(sel, items, preferred) {
  sel.innerHTML = "";
  items.forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v === "official" ? "official（原始模型）" : v;
    sel.appendChild(o);
  });
  if (preferred && items.includes(preferred)) sel.value = preferred;
}

async function init() {
  try {
    const [v, h] = await Promise.all([
      fetch("/api/variants").then(r => r.json()),
      fetch("/api/health").then(r => r.json()),
    ]);
    meta = v;
    fill($("llm"), v.parts.llm, "llm_best");
    fill($("flow"), v.parts.flow, "flow_best");
    fill($("hift"), v.parts.hift, "official");
    $("instruct").value = v.default_instruct;
    DEFAULT_INSTRUCT = v.default_instruct;
    checkInstruct();

    $("prompt_name").innerHTML = "";
    if (v.prompts.length === 0) {
      const o = document.createElement("option");
      o.value = ""; o.textContent = "（沒有預設音色，請上傳）";
      $("prompt_name").appendChild(o);
    } else {
      v.prompts.forEach(p => {
        const o = document.createElement("option");
        o.value = p; o.textContent = p;
        $("prompt_name").appendChild(o);
      });
    }

    const bits = [h.cuda ? `GPU: ${h.device}` : "⚠️ 沒有 CUDA，會非常慢"];
    if (!v.base_present) bits.push("⚠️ 找不到官方模型");
    bits.push(`可選 checkpoint — llm ${v.parts.llm.length} / flow ${v.parts.flow.length} / hift ${v.parts.hift.length}`);
    $("health").textContent = bits.join("　·　");
    if (!h.cuda || !v.base_present) $("health").classList.add("err");
    refreshSource();
  } catch (e) {
    $("health").textContent = "無法連線到後端：" + e;
    $("health").classList.add("err");
  }
}

$("go").onclick = async () => {
  const text = $("text").value.trim();
  if (!text) { $("status").textContent = "請先輸入文字"; return; }
  const file = $("prompt_wav").files[0];
  if (!file && !$("prompt_name").value) { $("status").textContent = "請選擇或上傳音色來源"; return; }

  if (srcSeconds != null && srcSeconds > MAX_PROMPT_SEC) {
    $("status").innerHTML = `<span class="err">參考音檔 ${srcSeconds.toFixed(1)} 秒，超過 ${MAX_PROMPT_SEC} 秒上限，請先裁切（建議 3–10 秒）</span>`;
    return;
  }
  if (srcSeconds != null && srcSeconds < MIN_PROMPT_SEC) {
    $("status").innerHTML = `<span class="err">參考音檔只有 ${srcSeconds.toFixed(2)} 秒，太短不足以描述音色</span>`;
    return;
  }

  const fd = new FormData();
  fd.append("text", text);
  fd.append("llm", $("llm").value);
  fd.append("flow", $("flow").value);
  fd.append("hift", $("hift").value);
  fd.append("instruct", $("instruct").value);
  fd.append("speed", $("speed").value);
  fd.append("text_frontend", $("text_frontend").value);
  const rawSeed = $("seed").value.trim();
  const seedNum = rawSeed === "" ? -1 : Number(rawSeed);
  if (!Number.isInteger(seedNum) || seedNum < -1 || seedNum > 2147483647) {
    $("status").innerHTML = '<span class="err">seed 必須是 -1 或 0–2147483647 的整數</span>';
    return;
  }
  fd.append("seed", String(seedNum));
  if (file) fd.append("prompt_wav", file);
  else fd.append("prompt_name", $("prompt_name").value);

  $("go").disabled = true;
  const started = performance.now();
  $("status").textContent = "合成中…（切換 checkpoint 時要重新載入模型，第一次會比較久）";
  try {
    const res = await fetch("/api/tts", { method: "POST", body: fd });
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).detail || msg; } catch (_) { }
      throw new Error(msg);
    }
    const blob = await res.blob();
    addResult({
      url: URL.createObjectURL(blob),
      llm: $("llm").value, flow: $("flow").value, hift: $("hift").value,
      text, elapsed: ((performance.now() - started) / 1000).toFixed(1),
      duration: res.headers.get("X-Duration-Sec"),
      seed: res.headers.get("X-Seed"),
      prompt: file ? file.name : $("prompt_name").value,
      uploaded: !!file,
    });
    $("status").textContent = "";
  } catch (e) {
    $("status").innerHTML = `<span class="err">失敗：${e.message}</span>`;
  } finally {
    $("go").disabled = false;
  }
};

function addResult(r) {
  const empty = document.querySelector("#results .empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <h3>${escapeHtml(r.text)}</h3>
    <div class="tags">
      <span class="tag b">llm: ${r.llm}</span>
      <span class="tag b">flow: ${r.flow}</span>
      <span class="tag b">hift: ${r.hift}</span>
      <span class="tag${r.uploaded ? " up" : ""}">音色: ${r.uploaded ? "⬆ " : ""}${escapeHtml(r.prompt)}</span>
      <span class="tag">長度 ${r.duration}s</span>
      <span class="tag">耗時 ${r.elapsed}s</span>
      <span class="tag seed" data-seed="${r.seed}" title="點一下沿用這個 seed">seed ${r.seed}</span>
    </div>
    <audio controls src="${r.url}"></audio>`;
  $("results").prepend(el);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

let previewUrl = null;
let srcSeconds = null;      // 目前音色來源的長度，null 表示還沒量到
const MAX_PROMPT_SEC = 30, MIN_PROMPT_SEC = 1;

function describeLen(sec) {
  if (sec == null) return "";
  if (sec > MAX_PROMPT_SEC) return ` — <span class="err">${sec.toFixed(1)} 秒，超過 ${MAX_PROMPT_SEC} 秒上限</span>`;
  if (sec < MIN_PROMPT_SEC) return ` — <span class="err">只有 ${sec.toFixed(2)} 秒，太短</span>`;
  return ` — ${sec.toFixed(1)} 秒`;
}

function refreshSource() {
  const f = $("prompt_wav").files[0];
  const box = $("active_src"), btn = $("filebtn_label"), audio = $("src_preview");
  $("prompt_name").disabled = !!f;
  $("clear_upload").hidden = !f;
  // 每次換來源都要釋放上一個 object URL，否則 blob 會一直留在記憶體
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  if (f) {
    btn.textContent = "⬆ " + f.name;
    btn.classList.add("has");
    box.className = "active-src upload";
    box.innerHTML = `目前使用<b>上傳的檔案</b>：<b>${escapeHtml(f.name)}</b>（下拉選單已停用）`;
    previewUrl = URL.createObjectURL(f);
    audio.src = previewUrl;
    audio.hidden = false;
    srcSeconds = null;
    audio.onloadedmetadata = () => {
      srcSeconds = audio.duration;
      box.innerHTML = `目前使用<b>上傳的檔案</b>：<b>${escapeHtml(f.name)}</b>${describeLen(srcSeconds)}`;
      if (srcSeconds > MAX_PROMPT_SEC) box.classList.add("bad");
      else box.classList.remove("bad");
    };
  } else {
    btn.textContent = "選擇音檔…";
    btn.classList.remove("has");
    box.className = "active-src";
    const v = $("prompt_name").value;
    box.innerHTML = v ? `目前使用預設音色：<b>${escapeHtml(v)}</b>`
                      : "尚未選擇音色，請從上方挑一個或上傳檔案";
    box.classList.remove("bad");
    srcSeconds = null;
    if (v) {
      audio.src = "/api/prompt/" + encodeURIComponent(v);
      audio.hidden = false;
      audio.onloadedmetadata = () => {
        srcSeconds = audio.duration;
        box.innerHTML = `目前使用預設音色：<b>${escapeHtml(v)}</b>${describeLen(srcSeconds)}`;
      };
    } else { audio.removeAttribute("src"); audio.hidden = true; }
  }
}
$("prompt_wav").addEventListener("change", refreshSource);
$("prompt_name").addEventListener("change", refreshSource);
$("clear_upload").onclick = () => { $("prompt_wav").value = ""; refreshSource(); };

$("reroll").onclick = () => { $("seed").value = "-1"; $("status").textContent = "下一次會用隨機 seed"; };

$("instruct").addEventListener("input", checkInstruct);
$("instr_reset").onclick = () => { $("instruct").value = DEFAULT_INSTRUCT; checkInstruct(); };

$("results").addEventListener("click", e => {
  const t = e.target.closest(".tag.seed");
  if (t) { $("seed").value = t.dataset.seed; $("status").textContent = `已沿用 seed ${t.dataset.seed}`; }
});

$("clear").onclick = () => { $("results").innerHTML = '<div class="empty">還沒有結果</div>'; };

init();
</script>
</body>
</html>
