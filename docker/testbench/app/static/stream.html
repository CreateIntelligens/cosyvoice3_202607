<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>串流合成</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1d26; --line:#2a2f3d; --ink:#e6e8ee;
    --muted:#8b93a7; --accent:#6ea8fe; --ok:#4ec9a5; --warn:#e6a23c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.6 system-ui,"Noto Sans TC",sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:19px; font-weight:600; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  a { color:var(--accent); }
  main { display:grid; grid-template-columns:400px 1fr; gap:20px; padding:20px 24px; align-items:start; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 5px; }
  label:first-child { margin-top:0; }
  select, textarea, input { width:100%; background:#0e1016; color:var(--ink);
    border:1px solid var(--line); border-radius:7px; padding:9px 10px; font:inherit; font-size:14px; }
  textarea { resize:vertical; min-height:90px; }
  button { background:var(--accent); color:#0b0d12; border:0; border-radius:7px;
           padding:11px 16px; font:inherit; font-weight:600; cursor:pointer; width:100%; margin-top:18px; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .hint { font-size:12px; color:var(--muted); margin-top:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 6px; font-size:14px; font-weight:600; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .tag { font-size:11px; padding:2px 8px; border-radius:20px;
         background:#232838; color:var(--muted); border:1px solid var(--line); }
  .tag.b { color:var(--accent); border-color:#33415c; }
  .tag.hot { color:var(--ok); border-color:#2d5548; background:#16241c; }
  audio { width:100%; margin-top:8px; }
  .empty { color:var(--muted); text-align:center; padding:48px 20px; }
  .err { color:#ff8f8f; }
  /* 第一塊的到達時間是這頁的重點，給它一個大字 */
  .ttfa { display:flex; align-items:baseline; gap:10px; margin:10px 0 4px; }
  .ttfa b { font-size:30px; color:var(--ok); font-variant-numeric:tabular-nums; }
  .ttfa span { font-size:12px; color:var(--muted); }
  .ttfa.waiting b { color:var(--warn); }
  /* 每一塊畫成一條，長度按音訊秒數，位置按抵達時間 */
  .chunks { margin-top:10px; }
  .chunk { display:flex; align-items:center; gap:8px; margin-bottom:3px; font-size:11px;
           color:var(--muted); font-variant-numeric:tabular-nums; }
  .chunk .bar { height:12px; background:#2d5548; border-radius:3px; flex:none; }
  .chunk .idx { width:34px; flex:none; }
  .chunk .at { width:62px; flex:none; color:var(--ink); }
  .live { color:var(--warn); font-size:12px; }
  /* 串流的聲音沒有 <audio> 可以按，控制項得自己給一個 */
  #bar { position:fixed; left:0; right:0; bottom:0; display:none; align-items:center; gap:12px;
         padding:12px 20px; background:#161922; border-top:1px solid var(--line); z-index:9; }
  #bar.on { display:flex; }
  #bar button { width:38px; height:38px; flex:none; margin:0; padding:0; border-radius:50%;
                font-size:13px; line-height:1; }
  #bar #bar_stop { background:#2a2f3d; color:var(--ink); }
  #bar .meta { flex:1; min-width:0; }
  #bar_name { font-size:12px; color:var(--muted); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
  #bar .track { height:4px; background:#2a2f3d; border-radius:2px; overflow:hidden; }
  #bar_fill { height:100%; width:0; background:var(--ok); transition:width .1s linear; }
  #bar_time { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  main { padding-bottom:80px; }
  .spoken { margin-top:8px; font-size:12px; color:var(--muted); padding:8px 11px;
            background:#0e1016; border:1px solid var(--line); border-radius:7px; }
</style>
</head>
<body>
<header>
  <h1>串流合成</h1>
  <div class="sub">
    邊生成邊播，量「多久聽得到第一個音」。<a href="/">回試聽台</a>　<a href="/dicts">台文對照表</a>
  </div>
</header>

<main>
  <section class="panel">
    <label>LLM</label>
    <select id="llm"></select>

    <label>音色</label>
    <select id="prompt_name"></select>

    <label>華語文字</label>
    <textarea id="text">颱風將在今天晚上開始影響台灣東部海域，氣象專家提醒民眾注意安全，這次的降雨強度可能會超過去年同期的紀錄。</textarea>
    <div class="hint">串流的價值在長文——短句還沒等到第二塊就做完了，看不出差別。</div>

    <label>文字轉換</label>
    <select id="annotate">
      <option value="none" selected>不轉換</option>
      <option value="hanji">轉台文（查表）</option>
      <option value="hanji_llm">轉台文（查表＋Gemini）</option>
    </select>

    <div class="row">
      <div>
        <label>語速</label>
        <input type="number" id="speed" value="1.0" step="0.05" min="0.5" max="2.0">
      </div>
      <div>
        <label>Seed（-1 隨機）</label>
        <input type="number" id="seed" value="-1">
      </div>
    </div>

    <label class="chk" style="display:flex;align-items:center;gap:7px;margin-top:12px;cursor:pointer">
      <input type="checkbox" id="autoplay" checked style="width:auto;margin:0">
      <span style="font-size:12px;color:var(--muted)">收到第一塊就開始播（無縫，下方可暫停）</span>
    </label>

    <button id="go">串流合成</button>
    <div class="hint" id="status"></div>
  </section>

  <section>
    <div id="results"><div class="empty">合成結果會留在這裡，可以重複聽</div></div>
  </section>
</main>

<div id="bar">
  <button id="bar_play" title="暫停／繼續">❚❚</button>
  <button id="bar_stop" title="停止">■</button>
  <div class="meta">
    <div id="bar_name"></div>
    <div class="track"><div id="bar_fill"></div></div>
  </div>
  <div id="bar_time"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let meta = null;

(async () => {
  const v = await (await fetch("/api/variants")).json();
  meta = v;
  const fill = (el, items, want) => {
    el.innerHTML = items.map(x => `<option value="${x}">${x}</option>`).join("");
    if (items.includes(want)) el.value = want;
  };
  fill($("llm"), v.parts.llm, (v.startup || {}).llm || "official");
  fill($("prompt_name"), v.prompts, v.prompts[0]);
})();

let inflight = null;      // 生成中的 AbortController

$("go").onclick = async () => {
  if (inflight) { inflight.abort(); return; }     // 生成中再按 = 中止
  const text = $("text").value.trim();
  if (!text) return;
  inflight = new AbortController();
  $("go").textContent = "中止";
  $("status").textContent = "連線中…";

  const fd = new URLSearchParams({
    text, llm: $("llm").value, flow: "official", hift: "official",
    prompt_name: $("prompt_name").value, annotate: $("annotate").value,
    simplify: "none", speed: $("speed").value, seed: $("seed").value || "-1",
  });

  // 送出前拍快照：合成期間使用者可能改選單，卡片要標「這段實際用的」
  const snap = { text, llm: $("llm").value, prompt: $("prompt_name").value,
                 annotate: $("annotate").value };
  const card = newCard(snap);
  const t0 = performance.now();
  // 這一批接管播放器；上一批（不管是串流還是卡片重聽）在這裡就停了
  const session = $("autoplay").checked
    ? player.begin(snap.text.slice(0, 40) + (snap.text.length > 40 ? "…" : "")) : 0;

  try {
    const res = await fetch("/api/tts/stream",
                            { method: "POST", body: fd, signal: inflight.signal });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    await consume(res.body.getReader(), card, t0, session);
  } catch (e) {
    const aborted = e.name === "AbortError";
    card.live && card.live.remove();
    card.status.innerHTML = aborted
      ? `<span class="tag">已中止</span>` : `<span class="err">失敗：${esc(e.message)}</span>`;
    if (!aborted) $("status").innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
  // 生成結束（或中止）後總長就定了，播放列才知道什麼時候該收起來
  if (session === player.session) player.live = false;
  inflight = null;
  $("go").textContent = "串流合成";
  $("status").textContent = "";
};

// 串流格式是「一行 JSON + 一塊 WAV」重複。要邊收邊解析，所以自己管緩衝區，
// 不能等 response 收完——那就失去串流的意義了。
async function consume(reader, card, t0, session) {
  let buf = new Uint8Array(0);
  const blobs = [];
  const player = new GaplessPlayer();

  const push = (u8) => {
    const n = new Uint8Array(buf.length + u8.length);
    n.set(buf); n.set(u8, buf.length); buf = n;
  };
  const nl = () => buf.indexOf(10);   // \n

  while (true) {
    const { done, value } = await reader.read();
    if (value) push(value);
    let progressed = true;
    while (progressed) {
      progressed = false;
      const i = nl();
      if (i < 0) break;
      const head = JSON.parse(new TextDecoder().decode(buf.slice(0, i)));
      if (head.done || head.error) {
        buf = buf.slice(i + 1);
        finish(card, head, blobs, t0);
        return;
      }
      if (buf.length < i + 1 + head.bytes) break;      // WAV 還沒收齊
      const wav = buf.slice(i + 1, i + 1 + head.bytes);
      buf = buf.slice(i + 1 + head.bytes);
      progressed = true;

      const blob = new Blob([wav], { type: "audio/wav" });
      blobs.push(blob);
      addChunk(card, head, blob);
      if (session) player.push(session, wav.buffer.slice(wav.byteOffset, wav.byteOffset + wav.byteLength));
    }
    if (done) break;
  }
}

// 無縫播放：把每塊解碼成 AudioBuffer，用**絕對時間**排程，而不是等前一塊
// 播完再放下一塊。<audio> 依序播的做法在每個接縫都會停一下——載入、解碼、
// 起播各有延遲，加起來就是聽得出來的空隙。
//
// 排程的關鍵是 nextAt：第一塊決定起播時間（現在 + 一點緩衝），之後每塊接在
// 前一塊結束的那一刻。只要生成追得上播放（RTF < 1，我們現在 0.5）就不會斷。
//
// 排程過的東西不會自己讓位：第二次生成若另開一個播放器，兩批音會疊著響，
// 而且沒有東西叫得停。所以全頁只有這一個播放器，用 session 編號區分批次——
// 換批就把舊的 source 全部 stop()，舊 session 再送來的塊直接丟掉。
class GaplessPlayer {
  constructor() {
    this.ctx = null;
    this.session = 0;
    this.sources = [];
    this.nextAt = 0;
    this.startAt = 0;       // 這批的起播時刻（ctx 時間軸）
    this.scheduled = 0;     // 已排程的總秒數
    this.label = "";
    this.chain = Promise.resolve();   // 解碼是非同步的，但排程順序必須照收到的順序
    this.live = false;      // 還在串流中（總長還會增加）
  }
  _ctx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    return this.ctx;
  }
  // 開一批新的，回傳這批的號碼。舊的立刻停。
  begin(label) {
    this.stop();
    pauseAllTags();               // 卡片上的 <audio> 也要讓位
    this.session += 1;
    this.label = label;
    this.live = true;
    this.startAt = 0;
    this.scheduled = 0;
    this._ctx();
    bar.show(this);
    return this.session;
  }
  push(session, arrayBuffer) {
    if (session !== this.session) return;
    this.chain = this.chain.then(async () => {
      if (session !== this.session) return;
      const ctx = this._ctx();
      let audio;
      try { audio = await ctx.decodeAudioData(arrayBuffer); }
      catch (e) { return; }                       // 壞掉的塊跳過，不要卡住整條鏈
      if (session !== this.session) return;       // 解碼期間被換掉了
      const src = ctx.createBufferSource();
      src.buffer = audio;
      src.connect(ctx.destination);
      // 落後了就從現在開始，不要排在過去——那會讓瀏覽器立刻播完，聽起來是爆音
      const at = Math.max(this.nextAt, ctx.currentTime + 0.02);
      src.start(at);
      if (!this.startAt) this.startAt = at;
      this.nextAt = at + audio.duration;
      this.scheduled = this.nextAt - this.startAt;
      this.sources.push(src);
      src.onended = () => { this.sources = this.sources.filter(s => s !== src); };
    });
  }
  stop() {
    this.session += 1;                            // 讓在途的塊失效
    for (const s of this.sources) { try { s.stop(); } catch (e) {} }
    this.sources = [];
    this.nextAt = 0; this.startAt = 0; this.scheduled = 0;
    this.live = false;
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    bar.hide();
  }
  // 暫停用 ctx.suspend()：時間軸整條凍住，所有排好的絕對時間仍然對得上，
  // 恢復後接著走，不必重排。
  async pause()  { if (this.ctx) { await this.ctx.suspend(); bar.sync(); } }
  async resume() { if (this.ctx) { await this.ctx.resume();  bar.sync(); } }
  get paused()  { return !!this.ctx && this.ctx.state === "suspended"; }
  get elapsed() { return this.startAt ? Math.max(0, Math.min(this.ctx.currentTime - this.startAt, this.scheduled)) : 0; }
  get playing() { return this.startAt > 0 && (this.live || this.elapsed < this.scheduled - 0.01); }
}

const player = new GaplessPlayer();

// 卡片上的 <audio> 跟 Web Audio 是兩套輸出，誰都不知道對方在響，要手動互斥
function pauseAllTags() {
  document.querySelectorAll("#results audio").forEach(a => { if (!a.paused) a.pause(); });
}
document.addEventListener("play", e => {
  if (e.target.tagName === "AUDIO") player.stop();
}, true);

// 底下那條播放列
const bar = {
  el: null, btn: null, name: null, time: null, fill: null, timer: null,
  init() {
    this.el = $("bar"); this.btn = $("bar_play"); this.name = $("bar_name");
    this.time = $("bar_time"); this.fill = $("bar_fill");
    this.btn.onclick = () => player.paused ? player.resume() : player.pause();
    $("bar_stop").onclick = () => player.stop();
  },
  show(p) {
    this.name.textContent = p.label;
    this.el.classList.add("on");
    clearInterval(this.timer);
    this.timer = setInterval(() => this.sync(), 100);
    this.sync();
  },
  hide() {
    clearInterval(this.timer); this.timer = null;
    if (this.el) this.el.classList.remove("on");
  },
  sync() {
    if (!this.el) return;
    const e = player.elapsed, t = player.scheduled;
    this.time.textContent = `${e.toFixed(1)} / ${t.toFixed(1)}s${player.live ? " ·串流中" : ""}`;
    this.fill.style.width = t ? `${Math.min(100, e / t * 100)}%` : "0%";
    this.btn.textContent = player.paused ? "▶" : "❚❚";
    // 播完了就收起來，但串流還沒結束的話要留著等下一塊
    if (!player.live && t > 0 && e >= t - 0.01 && !player.paused) player.stop();
  },
};
bar.init();

function newCard(snap) {
  const empty = document.querySelector("#results .empty");
  if (empty) empty.remove();
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <h3>${esc(snap.text.slice(0, 60))}${snap.text.length > 60 ? "…" : ""}</h3>
    <div class="tags">
      <span class="tag b">llm: ${esc(snap.llm)}</span>
      <span class="tag">音色: ${esc(snap.prompt)}</span>
      ${snap.annotate !== "none" ? `<span class="tag">${esc(snap.annotate)}</span>` : ""}
    </div>
    <div class="ttfa waiting"><b>—</b><span>秒後聽到第一個音</span></div>
    <div class="live">串流中…</div>
    <div class="chunks"></div>
    <div class="status"></div>`;
  $("results").prepend(el);
  return { el, ttfa: el.querySelector(".ttfa"), live: el.querySelector(".live"),
           chunks: el.querySelector(".chunks"), status: el.querySelector(".status") };
}

function addChunk(card, head, blob) {
  if (card.chunks.children.length === 0) {
    card.ttfa.querySelector("b").textContent = head.at.toFixed(2);
    card.ttfa.classList.remove("waiting");
  }
  const row = document.createElement("div");
  row.className = "chunk";
  row.innerHTML = `<span class="idx">#${head.chunk}</span>`
    + `<span class="at">${head.at.toFixed(2)}s</span>`
    + `<span class="bar" style="width:${Math.max(6, head.sec * 26)}px"></span>`
    + `<span>${head.sec.toFixed(2)}s</span>`;
  card.chunks.appendChild(row);
}

function finish(card, head, blobs, t0) {
  card.live.remove();
  if (head.error) {
    card.status.innerHTML = `<span class="err">${esc(head.error)}</span>`;
    return;
  }
  const elapsed = (performance.now() - t0) / 1000;
  const ttfa = parseFloat(card.ttfa.querySelector("b").textContent) || 0;
  card.el.querySelector(".tags").insertAdjacentHTML("beforeend",
    `<span class="tag hot">第一個音 ${ttfa.toFixed(2)}s</span>`
    + `<span class="tag">全部 ${elapsed.toFixed(2)}s</span>`
    + `<span class="tag">音長 ${head.total_sec}s</span>`
    + `<span class="tag">${head.chunks} 塊</span>`
    + `<span class="tag">seed ${head.seed}</span>`);
  // 把所有塊接成一個檔，右邊就能重複聽。WAV 各自有 44 byte 檔頭，
  // 除了第一塊都要去掉，否則播放器會在接縫處停住。
  (async () => {
    const parts = [];
    for (let i = 0; i < blobs.length; i++) {
      const ab = await blobs[i].arrayBuffer();
      parts.push(i === 0 ? ab : ab.slice(44));
    }
    const merged = new Blob(parts, { type: "audio/wav" });
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = URL.createObjectURL(merged);
    card.el.appendChild(audio);
    if (head.spoken) {
      const d = document.createElement("div");
      d.className = "spoken";
      d.textContent = "送進模型：" + head.spoken;
      card.el.appendChild(d);
    }
  })();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
</script>
</body>
</html>
