# Listen to Taigi checkpoints side by side against the official model.
#
#   cd docker/testbench && docker compose up -d && docker compose logs -f
#
# Ports 50001 and 8085 already belong to the ai-virtual-human stack on this host,
# so this one sits on 50010.
services:
  testbench:
    # 以官方映像為基底加上 vLLM，見同目錄的 Dockerfile。
    # 要退回舊行為：image 改成 happy74527/cosyvoice3-taipei1:latest（已標記為
    # cosyvoice3-taipei1:rollback-pre-vllm），並拿掉 LOAD_VLLM。
    # 以官方映像為基底加上 vLLM，見同目錄的 Dockerfile。
    # 退回：image 改回 happy74527/cosyvoice3-taipei1:latest（已標記為
    # cosyvoice3-taipei1:rollback-pre-vllm），LOAD_VLLM 設 0，然後 up -d。
    image: cosyvoice3-taipei1-vllm:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosyvoice3-testbench
    working_dir: /app
    command: python /app/server.py
    environment:
      PORT: "50010"
      MODELS_ROOT: /models
      COSYVOICE_ROOT: /opt/CosyVoice
      PYTHONUNBUFFERED: "1"
      # This 20 GB card is shared with serve-tts-1, indextts-service and
      # sensevoice-service, which between them hold ~14 GB. Repeatedly loading and
      # releasing checkpoints fragments what little is left, so long inputs OOM on
      # allocations as small as 12 MiB. Expandable segments let the allocator grow a
      # region instead of hunting for a contiguous free block.
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # vLLM 加速 LLM 那段。實測 RTF 1.35 → 0.39（LLM 10.33s → 2.01s）。
      # 代價：每個 checkpoint 第一次載入要多花約 3 分鐘匯出權重，之後沿用
      # （匯出檔存在 testbench-variants 這個 volume，重啟不會消失）。
      LOAD_VLLM: "1"
      # 併發名額。指定 seed 的請求一律獨佔（見 server.py 的 Gate），這裡管的是
      # 隨機 seed 的請求能同時跑幾個。實測（30 字，vLLM 開、TRT 關）：
      #
      #   併發數   牆鐘      吞吐      每發延遲
      #     1      4.57s    1.00×     4.57s
      #     2      7.07s    1.29×     6.4–7.1s
      #     4     12.29s    1.49×    11.2–12.3s
      #     6     19.15s    1.43×    12.4–19.1s   ← 已經沒有更好
      #
      # 天花板約 1.5 倍，四發就到頂。原因是一發請求本來就把 GPU 餵得差不多滿了：
      # vLLM 讓 LLM 那段變快之後，剩下的時間都在 flow 與聲碼器，那是密集運算，
      # 沒有閒置可以撿。
      #
      # 預設留 2：換到 1.29 倍吞吐只多等 2.5 秒。開到 4 多拿 0.2 倍，但每一發要
      # 等三倍久——互動聽測不划算，純跑批次才划算。
      TTS_CONCURRENCY: "2"
      # flow decoder 走 TensorRT。**實測沒有可量到的好處**，所以關著。
      #
      # 同條件 A/B（閘=4，同一段 30 字）：單發 4.47s 對 4.57s、2 發併發 7.41s
      # 對 7.07s、4 發併發 11.82s 對 12.29s。三個差異是 -2.2% / +4.8% / -3.8%，
      # 而單發自己的散佈就有 ±10%（4.26 到 5.15）——量不出差別。
      #
      # 而且它幫不了併發：上下文池只開得到 1（見下面 TRT_CONCURRENT），flow 那段
      # 照樣一次一個。開著只是多佔 1.3 GB 顯存，這張卡跟別人共用，不划算。
      #
      # ONNX 與編譯好的引擎留在 _trt/<flow>/，改成 "1" 就能直接用、不必重編。
      # 那個目錄是刻意放在變體目錄外面的：get_model 的 rmtree 曾經把它們一起
      # 刪掉，服務因此 500。
      LOAD_TRT: "0"
      # TRT 執行上下文池。開 2 能讓 flow 那段真的並行——那是目前併發的瓶頸——
      # 但這張卡塞不下第二個上下文，即使把 vLLM 的 KV 從 0.2 降到 0.10 也一樣。
      #
      # 上下文要照 profile 的上限預留，而上限是 3000 幀（60 秒）。那不是浮報：
      # 這裡最長的參考音 21.5 秒，加上 80 字最慢約 26.7 秒，最壞就是 2409 幀。
      # 再扣掉另一個服務常駐的 5.3 GB，空間就是不夠。換張卡或關掉鄰居才有得談。
      TRT_CONCURRENT: "1"
      # 上游把 vLLM 的 KV 池寫死 0.2，實測那有一百倍餘裕：拿到 2.06 GiB、
      # 放得下 18 萬 token，而一發請求只用約 308 個，六發併發 preemption 0 次。
      # 讓出來給第二個 TRT 上下文——先前它就是因為顯存不夠建不起來。
      VLLM_GPU_FRACTION: "0.10"
      # vLLM 會檢查「KV 池至少放得下一整條最長序列」，而上游沿用 Qwen 的 32768。
      # 降記憶體就會卡在這個檢查（它建議加記憶體，但那是治標）。CosyVoice 一發
      # 只用約 300–500 個 token，80 字的上限也才 1600，4096 綽綽有餘。
      VLLM_MAX_LEN: "4096"
      # onnxruntime 靠這個才找得到 cuDNN 8。少了它 speaker embedding 會安靜地
      # 退回 CPU——不報錯，只是慢七倍，看起來像 vLLM 沒效果。
      LD_LIBRARY_PATH: /opt/cosyvoice-venv/lib/python3.10/site-packages/nvidia/cudnn/lib
      # /v1 是給 agent 呼叫的介面。沒有這把 token 它一律回 503——寧可停用，
      # 也不要因為忘了設定就變成開放端點。放進 .env，不要寫進這個檔。
      TTS_API_KEY: ${TTS_API_KEY:-}
      # 掛哪組 checkpoint 是伺服器的決定，呼叫端不指定。換版本改這裡重啟即可，
      # model_version 會跟著變，呼叫端的快取自動失效。
      # v7 = v6 底 + 媠聲 4.62 h。聽完 v5 到 v9b 全部版本之後的選擇——不是照
      # CV loss 選的，v7 的 loss（2.644）在候選裡最差，而放大第二階段的 v9b
      # loss 最低（1.352）卻連 155 字都講不完。詳見
      # reports/taigi-tailo-scaling-2026-08-20.md
      TTS_API_LLM: ${TTS_API_LLM:-llm_v7_best}
      # 標音層的 gemini 模式要用。沒設的話那個選項會自動退回語料預設。
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # 未知詞、點讚點爛、LLM 補的表都寫這裡。repo 是唯讀掛載，寫不進去。
      TAIGI_DATA: /data/taigi
      # /admin 用的權杖，跟 TTS_API_KEY 分開。沒設就不掛載那組端點。
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TTS_API_FLOW: ${TTS_API_FLOW:-official}
      TTS_API_HIFT: ${TTS_API_HIFT:-official}
    # This host already runs 55 containers across 33 bridge networks and Docker's
    # default address pools are exhausted, so creating another one fails. Host
    # networking sidesteps it; the server binds 0.0.0.0:50010 itself.
    network_mode: host
    volumes:
      - ./app:/app:ro
      # The image ships the code from commit 7526c48; mount the working tree so
      # the flow/dataset/average_model fixes apply without rebuilding 21 GB.
      - ../..:/opt/CosyVoice:ro
      - ${MODELS_DIR:-../../models}:/models:ro
      # base/ is the official model and lives outside the repo, so a symlink under
      # models/ would dangle inside the container. Mount the real directory on top.
      - ${BASE_MODEL_DIR:-../../workspace/cosyvoice3_smoke_10spk/models/Fun-CosyVoice3-0.5B}:/models/base:ro
      - testbench-variants:/tmp/cosyvoice-variants
      # 分層表與回饋紀錄。跟 repo 分開，重建底表不會動到這裡面的東西。
      - ./data:/data/taigi
    shm_size: "8gb"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  testbench-variants:
